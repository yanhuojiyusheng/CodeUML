<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeUML - 代码转UML类图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;background:#1a1a1a;color:#e0e0e0}
header{padding:8px 16px;background:#252526;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333}
header h1{font-size:14px;font-weight:500;color:#ccc}
.controls{display:flex;gap:12px;align-items:center;margin-left:auto}
.controls label{font-size:11px;color:#888;display:flex;align-items:center;gap:4px}
.controls input{width:45px;padding:3px 6px;background:#333;color:#fff;border:1px solid #555;border-radius:3px;font-size:11px}
.controls input:focus{border-color:#0078d4;outline:none}
button{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;background:#0078d4;color:#fff}
button:hover{background:#1a8fe8}
button.danger{background:#d73a49}
button.danger:hover{background:#e5534b}
main{flex:1;display:flex;overflow:hidden}
#file-sidebar{width:var(--sidebar-width,170px);min-width:36px;max-width:600px;background:#252526;border-right:1px solid #333;display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#file-sidebar.collapsed{width:36px}
#file-sidebar.resizing{transition:none}
#sidebar-header{display:flex;align-items:center;justify-content:flex-end;padding:4px;flex:0 0 auto}
#file-sidebar.collapsed #sidebar-header{justify-content:center;padding:4px 0}
#sidebar-toggle{background:none;border:none;color:#888;font-size:14px;cursor:pointer;padding:4px 8px;border-radius:3px}
#sidebar-toggle:hover{background:#333;color:#fff}
#file-sidebar.collapsed #file-tabs{display:none}
#sidebar-resizer{width:5px;cursor:col-resize;background:#2a2a2a;flex:none;transition:background .15s}
#sidebar-resizer:hover,#sidebar-resizer.dragging{background:#0078d4}
#file-sidebar.collapsed + #sidebar-resizer{display:none}
#file-tabs{display:flex;flex-direction:column;flex:1;overflow-y:auto;overflow-x:hidden;background:#252526}
.file-tab{padding:8px 12px;cursor:pointer;font-size:12px;color:#888;border-right:2px solid transparent;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.file-tab:hover{color:#ccc;background:#2a2a2a}
.file-tab.active{color:#fff;border-right-color:#0078d4;background:#1e1e1e}
.file-tab .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file-tab .close{opacity:0.5;font-size:14px;line-height:1;flex:0 0 auto}
.file-tab .close:hover{opacity:1;color:#ff6b6b}
.file-tab.add-tab{color:#4ec9b0;font-size:16px;font-weight:bold;cursor:pointer;border-top:1px solid #333;justify-content:center}
.file-tab.add-tab:hover{background:#2a2a2a;color:#6ee6d6}
#divider{width:6px;cursor:col-resize;background:#333;flex:none;transition:background .15s}
#divider:hover,#divider.dragging{background:#0078d4}
#editor-pane{flex:1;display:flex;flex-direction:column;min-width:200px}
#editor-pane.drag-over{background:#2a2a2a;border:2px dashed #0078d4}
#code-container{flex:1;overflow:hidden;position:relative}
textarea{width:100%;height:100%;background:#1e1e1e;color:#d4d4d4;border:none;padding:12px;font-family:'Fira Code','Cascadia Code',monospace;font-size:13px;resize:none;outline:none;line-height:1.5}
.drop-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;font-size:16px;pointer-events:none;display:none}
#editor-pane.drag-over .drop-hint{display:block}
#right-pane{flex:0 0 50%;display:flex;flex-direction:column;overflow:hidden}
#view-tabs{display:flex;background:#252526;border-bottom:1px solid #333;padding:0 8px}
.tab{padding:8px 16px;cursor:pointer;font-size:12px;color:#888;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#ccc}
.tab.active{color:#fff;border-bottom-color:#0078d4}
#relation-mode-btn{margin-left:auto;background:#333;color:#ccc;border:1px solid #555;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap}
#relation-mode-btn:hover{background:#444;color:#fff;border-color:#888}
#diagram-view,#xml-view,#parsed-view{flex:1;overflow:auto;display:none}
#diagram-view.active,#xml-view.active,#parsed-view.active{display:block}
#diagram-view{background:#f8f8f8;padding:20px}
#xml-view textarea,#parsed-view textarea{background:#1e1e1e;color:#d4d4d4;width:100%;height:100%;border:none;padding:12px;font-family:'Fira Code','Cascadia Code',monospace;font-size:13px;resize:none;outline:none;line-height:1.5}
.status{padding:4px 16px;background:#007acc;color:#fff;font-size:11px}
.class-box rect{stroke:#333;stroke-width:1.5;rx:2}
.class-box text{font-family:system-ui,sans-serif;font-size:12px}
.class-box .title{font-weight:bold;text-anchor:middle}
.class-box .stereotype{font-style:italic;text-anchor:middle;fill:#666}
.class-box .sep{stroke:#999;stroke-width:1}
#diagram-view svg{user-select:none}
#diagram-view .relation{cursor:pointer}
#diagram-view .relation.highlighted line:not(.hit),
#diagram-view .relation.highlighted polygon,
#diagram-view .relation.highlighted path{stroke:#ff6b00;stroke-width:3}
#diagram-view .relation.highlighted polygon{fill:#ffd9b3}
#diagram-view .relation.highlighted text{fill:#e65100;font-weight:bold}
#diagram-view .relation.highlighted{filter:drop-shadow(0 0 3px rgba(255,107,0,0.75))}
#diagram-view .class-box.highlighted rect{stroke:#ff6b00;stroke-width:2.5;fill:#fff7e6}
#diagram-view .class-box.highlighted{filter:drop-shadow(0 0 4px rgba(255,107,0,0.6))}
</style>
</head>
<body>
<header>
<h1>CodeUML</h1>
<div class="controls">
  <label title="最大显示属性数">属性: <input type="number" id="max-props" value="8" min="3" max="20"></label>
  <label title="最大显示方法数">方法: <input type="number" id="max-methods" value="8" min="3" max="20"></label>
</div>
<button onclick="exportDrawio()">导出 .drawio</button>
<button onclick="exportSVG()">导出 SVG</button>
<button onclick="exportPlantUML()">导出 PlantUML</button>
</header>
<main>
<div id="file-sidebar">
  <div id="sidebar-header">
    <button id="sidebar-toggle" title="折叠文件栏">«</button>
  </div>
  <div id="file-tabs"></div>
</div>
<div id="sidebar-resizer" title="拖动调整文件栏宽度"></div>
<div id="editor-pane">
  <div id="code-container">
    <textarea id="code" spellcheck="false" placeholder="在此粘贴 TypeScript 代码，或拖放 .ts 文件..."></textarea>
    <div class="drop-hint">拖放 .ts / .tsx 文件到此处</div>
  </div>
</div>
<div id="divider" title="拖动调整左右宽度"></div>
<div id="right-pane">
  <div id="view-tabs">
    <div class="tab active" data-view="diagram">图表</div>
    <div class="tab" data-view="xml">Draw.io XML</div>
    <div class="tab" data-view="parsed">PlantUML</div>
    <button id="relation-mode-btn" title="切换关系显示模式：全部 / 较强 / 最强">关系: 全部</button>
  </div>
  <div id="diagram-view" class="active"></div>
  <div id="xml-view"><textarea id="xml-output" readonly></textarea></div>
  <div id="parsed-view"><textarea id="parsed-output" readonly></textarea></div>
</div>
</main>
<div class="status" id="status">就绪 - 拖放文件或粘贴代码开始</div>
<script src="https://cdn.jsdelivr.net/npm/typescript@5.4.5/lib/typescript.min.js"></script>
<script src="dist/bundle.js"></script>
</body>
</html>
